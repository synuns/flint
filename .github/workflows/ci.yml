# T43 CI 파이프라인 — 단위 테스트 + 실 Doltgres e2e.
# 태그 push(v*) 시 release 잡이 goreleaser로 자동 Release 생성(실 태그 push는 사용자 확인 후 수행 — 비간섭 원칙).
name: ci

on:
  push:
    branches: [main]
    # v0.16.0 R1: branches 필터만 있으면 태그 push는 워크플로 미발동 —
    # release 잡 실행을 위해 태그 트리거 명시 필요.
    tags: ["v*"]
  pull_request:
  # v0.16.1: 수동 발동(태그 push 없이 release 잡 디버깅·검증용).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # ADR-0010: 호스트 5434 -> 컨테이너 5432 (docker-compose.yml과 동일 설정)
      # v0.16.1: latest 부유 digest 고정 — v0.15.2 이후 실증 빌드. 갱신 시 e2e 재검증 필요.
      doltgres:
        image: dolthub/doltgresql@sha256:3a119bb6726a0be283cfda2a73fa9fbdff58df06c0b850f245cd1828f57281a6
        ports:
          - 5434:5432
        env:
          DOLTGRES_USER: flint
          DOLTGRES_PASSWORD: flint-dev
          DOLTGRES_DB: flint
    env:
      # e2e DSN 주입: tests/e2e는 FLINT_DSN 우선
      FLINT_DSN: postgresql://flint:flint-dev@localhost:5434/flint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PyYAML 설치 (validate_yaml.py 의존 — runner 선행 패키지 가정 제거)
        run: python3 -m pip install pyyaml
      - name: DB 준비 대기 (Doltgres 워밍업 — 포트 오픈≠쿼리 준비, 초기 패키지 retries_exhausted 방지)
        run: |
          go build -o /tmp/flint-wait ./cmd/flint
          for i in $(seq 1 30); do
            if /tmp/flint-wait doctor --check db >/dev/null 2>&1; then
              echo "DB ready (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "DB not query-ready after 60s"; exit 1
      - name: flint_test 데이터베이스 생성 (서비스는 flint만 생성 — make ci의 FLINT_TEST_DSN 기본값 대상)
        run: |
          PSQL="psql postgresql://flint:flint-dev@localhost:5434/flint"
          ready=0
          for i in $(seq 1 15); do
            if $PSQL -c "SELECT 1" >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          # v0.16.1: 준비 실패 시 무조건 진행 → CREATE가 서버 미기동 오류로 실패. 15회 소진 시 즉시 중단.
          if [ "$ready" -ne 1 ]; then
            echo "psql 30s 내 준비 안 됨 — CI 중단"; exit 1
          fi
          $PSQL -c "CREATE DATABASE flint_test" 2>/dev/null || echo "flint_test 이미 존재 — 계속"
      - name: YAML 검증 + 단위 테스트
        run: make ci GO_TEST_FLAGS="-p 1"
      - name: e2e (실 Doltgres)
        run: make e2e

  # T1 태그 push(v*) 시 goreleaser 자동 Release 생성 — 바이너리(tar.gz) + 플러그인 zip 첨부.
  # 실 태그 push는 사용자 확인 후 수행(비간섭 원칙 유지).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
          # v0.16.1: latest 부유 → 고정(로컬 실증 버전과 동일 계열). 상향 시 snapshot 재실증 필요.
          version: v2.19.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 릴리스 링크
        run: echo "https://github.com/synuns/flint/releases/tag/${GITHUB_REF#refs/tags/}"
