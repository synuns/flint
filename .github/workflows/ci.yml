# T43 CI 파이프라인 — 단위 테스트 + 실 Doltgres e2e.
# 태그 push는 안내만 출력(실 릴리스 push는 사용자 확인 후 수행 — 비간섭 원칙).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # ADR-0001: 호스트 5433 -> 컨테이너 5432 (docker-compose.yml과 동일 설정)
      doltgres:
        image: dolthub/doltgresql:latest
        ports:
          - 5433:5432
        env:
          DOLTGRES_USER: flint
          DOLTGRES_PASSWORD: flint-dev
          DOLTGRES_DB: flint
    env:
      # e2e DSN 주입: tests/e2e는 FLINT_DSN 우선
      FLINT_DSN: postgresql://flint:flint-dev@localhost:5433/flint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: YAML 검증 + 단위 테스트
        run: make ci
      - name: e2e (실 Doltgres)
        run: make e2e

  # 태그 push(v*) 시 릴리스 절차 안내만 — 실 태그·push는 사용자 확인 후.
  release-notice:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 릴리스 안내
        run: |
          echo "태그 감지: ${GITHUB_REF#refs/tags/}"
          echo "릴리스 절차(사용자 확인 후): git tag vX.Y.Z && git push origin vX.Y.Z -> goreleaser 빌드(darwin arm64/amd64) -> Release 첨부"
