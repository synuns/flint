# flint CI — 완전 자동 파이프라인 (v0.16.7)
#
# 흐름:
#   PR → test (게이트)
#   main push → test → deploy (VERSION 변경 감지 → 태그 → goreleaser → MCP Registry)
#   태그 push(수동 폴백) → test → deploy
#
# 사용자는 PR에 VERSION+배지+plugin.json 갱신만 하면 나머지 전부 자동.
name: ci

# v0.28.0(H④): 루트 권한 박탈 — 잡별 최소 명시(deploy만 write). test 잡은
# PR 코드를 실행하므로 넓은 기본 상속 토큰과 결합하지 않게 한다.
permissions: {}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 같은 레프의 연속 실행은 이전 실행 취소(러너 절약).
# deploy는 멱등 가드(태그·릴리스 존재 감지)가 있어 취소 후 재실행이 안전.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: # v0.28.0(H④): 루트 박탈 — 캐시 복원에 필요한 최소만
      actions: read
      contents: read
    services:
      doltgres:
        image: dolthub/doltgresql@sha256:3a119bb6726a0be283cfda2a73fa9fbdff58df06c0b850f245cd1828f57281a6
        ports:
          - 5434:5432
        env:
          DOLTGRES_USER: flint
          DOLTGRES_PASSWORD: flint-dev
          DOLTGRES_DB: flint
    env:
      FLINT_DSN: postgresql://flint:flint-dev@localhost:5434/flint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: PyYAML 설치
        run: python3 -m pip install -r scripts/requirements.txt
      - name: DB 준비 대기 (단일 게이트)
        run: |
          go build -o /tmp/flint-wait ./cmd/flint
          for i in $(seq 1 30); do
            if /tmp/flint-wait doctor --check db >/dev/null 2>&1; then
              echo "DB ready (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "DB not query-ready after 60s"; exit 1
      - name: flint_test 데이터베이스 생성
        # doctor 통과 = 쿼리 준비 완료. psql 대기 루프 없이 1회 시행만.
        run: |
          PSQL="psql postgresql://flint:flint-dev@localhost:5434/flint"
          if ! $PSQL -c "SELECT 1" >/dev/null 2>&1; then
            echo "psql 접속 실패 — doctor 통과 직후 불일치"; exit 1
          fi
          if out=$($PSQL -c "CREATE DATABASE flint_test" 2>&1); then
            echo "flint_test 생성 완료"
          elif echo "$out" | grep -qi "already exists"; then
            echo "flint_test 이미 존재 — 계속"
          else
            echo "flint_test 생성 실패: $out"; exit 1
          fi
      - name: 정적 분석 (staticcheck)
        # 버전 고정(재현성) — 상향 시 로컬 실증 후 이 버전만 갱신.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          make lint
      - name: YAML 검증 + 단위 테스트
        run: make ci GO_TEST_FLAGS="-p 1"
      - name: e2e (실 Doltgres)
        run: make e2e

  # 완전 자동 배포: test 통과 후 실행.
  #   main push: VERSION 파일 변경 감지 → 새 버전이면 태그+릴리스+MCP 발행
  #   태그 push: 무조건 릴리스(수동 폴백)
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: # deploy만 write(릴리스·OIDC) — 루트는 박탈(v0.28.0 H④)
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # ── 배포 대상 결정 ──
      - name: 버전 감지·태그 생성 (main push 시)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 태그 push — 수동 폴백
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "ver=${VER}" >> "$GITHUB_OUTPUT"
            echo "모드: 태그 push(${TAG})"
          else
            # main push — VERSION 파일 감지
            VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
            if [ -z "$VERSION" ]; then
              echo "VERSION 파일 없음 — 배포 스킵"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="v${VERSION}"
            # 태그 존재로만 판단 — goreleaser·MCP는 각자 멱등(자체 가드).
            # 태그 없으면 새 버전 → 무조건 배포 시도(goreleaser는 릴리스
            # 존재 시 스킵, MCP는 항상 실행 — 이전 실패 재시도 포함).
            if git tag -l "$TAG" | grep -q .; then
              echo "태그 ${TAG} 이미 존재 — 배포 스킵"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "새 버전 감지: ${TAG} → 태그 생성"
            git config user.name "synuns"
            git config user.email "57736547+synuns@users.noreply.github.com"
            git tag "$TAG"
            # 태그 push 실패는 원격 태그 없는 릴리스 URL 붕괴로 이어짐 — 즉시 중단.
            # GITHUB_TOKEN push는 cascade 없음 — 재실행 안전.
            git push origin "$TAG"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "ver=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "모드: main push 자동 태그(${TAG})"
          fi

      # ── goreleaser (릴리스가 아직 없을 때만 — 멱등) ──
      - name: 릴리스 존재 확인
        id: relcheck
        if: steps.version.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip_goreleaser=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_goreleaser=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        if: steps.version.outputs.deploy == 'true' && steps.relcheck.outputs.skip_goreleaser != 'true'
        with:
          args: release --clean
          version: v2.19.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ── 릴리스 서명 (v0.31.0 ADR-0014) — COSIGN_PRIVATE_KEY 시크릿이
      # 있을 때만 checksums.txt에 키 서명(.sig 자산 업로드). flint update는
      # 임베드 공개키로 검증. 시크릿 미설정(전환 모드)은 스킵.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.version.outputs.deploy == 'true'
        with:
          cosign-release: v2.6.0 # v3은 sign-blob 번들 형식 상이 — 검증기·로컬과 v2 고정
      - name: 릴리스 서명 (checksums.txt)
        if: steps.version.outputs.deploy == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "서명 미구성(COSIGN_PRIVATE_KEY 시크릿 부재) — 스킵(전환 모드)"
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          gh release download "$TAG" -p checksums.txt -O /tmp/checksums.txt
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature /tmp/checksums.txt.sig /tmp/checksums.txt
          # v0.31.3(감사 1): 검증이 업로드보다 먼저 — 불일치 .sig가 릴리스에
          # 붙는 오염 자체를 예방한다. 임베드 공개키 쌍 불일치 조기 차단.
          if [ -s lib/cli/cosign.pub ]; then
            cosign verify-blob --key lib/cli/cosign.pub \
              --insecure-ignore-tlog --signature /tmp/checksums.txt.sig /tmp/checksums.txt
          else
            echo "경고: lib/cli/cosign.pub 미임베드(전환 모드) — 다음 릴리스 전 공개키 커밋 권장"
          fi
          gh release upload "$TAG" /tmp/checksums.txt.sig --clobber

      # ── MCP Registry 발행 (항상 실행 — 멱등) ──
      - name: MCP Registry 발행
        if: steps.version.outputs.deploy == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.ver }}"
          # mcp-publisher 설치 — v0.17.0 R1: latest 부유 → v1.8.7 고정(재현성).
          # 상향 시 수동 실증 후 이 버전만 갱신.
          curl -sfL --retry 3 --retry-delay 5 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz | tar xz -C /tmp
          chmod +x /tmp/mcp-publisher
          # github-oidc 인증 (Actions 환경 자동)
          /tmp/mcp-publisher login github-oidc
          # .mcpb 다운로드 (goreleaser가 올렸거나 기존 릴리스에서)
          MCPB_URL="https://github.com/synuns/flint/releases/download/${TAG}/flint_${VER}_darwin_arm64.mcpb"
          curl -sfL --retry 3 --retry-delay 5 "$MCPB_URL" -o /tmp/flint.mcpb
          if [ ! -s /tmp/flint.mcpb ]; then
            echo "error: .mcpb 다운로드 실패(${MCPB_URL})"; exit 1
          fi
          SHA256=$(sha256sum /tmp/flint.mcpb | cut -d' ' -f1)
          # server.json 렌더·발행
          sed -e "s|{{URL}}|${MCPB_URL}|g" \
              -e "s|{{SHA256}}|${SHA256}|g" \
              -e "s|{{VERSION}}|${VER}|g" \
              mcp-registry/server.json.template > /tmp/server.json
          /tmp/mcp-publisher publish /tmp/server.json

      - name: 배포 요약
        if: steps.version.outputs.deploy == 'true'
        run: |
          echo "✅ 배포 완료: ${{ steps.version.outputs.tag }}"
          echo "   Release: https://github.com/synuns/flint/releases/tag/${{ steps.version.outputs.tag }}"
          echo "   MCP Registry: https://registry.modelcontextprotocol.io"
