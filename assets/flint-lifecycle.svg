<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      .ink { fill:#e6edf3; } .sub { fill:#8b949e; } .box { stroke:#3d444d; fill:#151b23; }
      .arrow { stroke:#8b949e; } .arrowh { fill:#8b949e; }
      .num { fill:#58a6ff; font-weight:700; } .bg { fill:#0d1117; }
      .loop { stroke:#58a6ff44; } .looph { fill:#58a6ff; }
    }
    @media (prefers-color-scheme: light) {
      .ink { fill:#1f2328; } .sub { fill:#656d76; } .box { stroke:#d0d7de; fill:#f6f8fa; }
      .arrow { stroke:#656d76; } .arrowh { fill:#656d76; }
      .num { fill:#0969da; font-weight:700; } .bg { fill:#ffffff; }
      .loop { stroke:#0969da44; } .looph { fill:#0969da; }
    }
  </style>
  <rect class="bg" width="880" height="240" rx="8"/>

  <text class="ink" x="440" y="30" text-anchor="middle" font-size="14" font-weight="700">하나의 세션 — 기억이 쌓이는 순환</text>

  <rect class="box" x="40" y="60" width="160" height="80" rx="10"/>
  <text class="num" x="120" y="86" text-anchor="middle" font-size="12">1</text>
  <text class="ink" x="120" y="106" text-anchor="middle" font-size="12" font-weight="600">세션 시작</text>
  <text class="sub" x="120" y="122" text-anchor="middle" font-size="10">hot — 문맥 주입</text>

  <line class="arrow" x1="200" y1="100" x2="240" y2="100" stroke-width="2"/>
  <polygon class="arrowh" points="240,100 234,96 234,104"/>

  <rect class="box" x="250" y="60" width="160" height="80" rx="10"/>
  <text class="num" x="330" y="86" text-anchor="middle" font-size="12">2</text>
  <text class="ink" x="330" y="106" text-anchor="middle" font-size="12" font-weight="600">작업</text>
  <text class="sub" x="330" y="122" text-anchor="middle" font-size="10">read — 회상하며 결정</text>

  <line class="arrow" x1="410" y1="100" x2="450" y2="100" stroke-width="2"/>
  <polygon class="arrowh" points="450,100 444,96 444,104"/>

  <rect class="box" x="460" y="60" width="160" height="80" rx="10"/>
  <text class="num" x="540" y="86" text-anchor="middle" font-size="12">3</text>
  <text class="ink" x="540" y="106" text-anchor="middle" font-size="12" font-weight="600">세션 종료</text>
  <text class="sub" x="540" y="122" text-anchor="middle" font-size="10">write — 기록 (멱등)</text>

  <line class="arrow" x1="620" y1="100" x2="660" y2="100" stroke-width="2"/>
  <polygon class="arrowh" points="660,100 654,96 654,104"/>

  <rect class="box" x="670" y="60" width="160" height="80" rx="10"/>
  <text class="num" x="750" y="86" text-anchor="middle" font-size="12">4</text>
  <text class="ink" x="750" y="106" text-anchor="middle" font-size="12" font-weight="600">검증</text>
  <text class="sub" x="750" y="122" text-anchor="middle" font-size="10">audit · restore</text>

  <path class="loop" d="M750 140 C750 190 120 190 120 140" fill="none" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon class="looph" points="120,140 116,148 124,148" opacity="0.6"/>
  <text class="sub" x="440" y="185" text-anchor="middle" font-size="10" opacity="0.7">기억이 축적되어 다음 세션이 더 똑똑해집니다</text>
</svg>
