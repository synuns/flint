<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      .ink { fill:#e6edf3; } .sub { fill:#8b949e; }
    }
    @media (prefers-color-scheme: light) {
      .ink { fill:#24292f; } .sub { fill:#57606a; }
    }
    .card { font-size:15px; font-weight:600; }
    .lbl  { font-size:12.5px; }
    .num  { font-size:16px; font-weight:700; fill:#fff; }
  </style>

  <text class="ink" x="480" y="42" text-anchor="middle" font-size="15" font-weight="700">하나의 세션 — 기억이 쌓이는 순환</text>

  <!-- 루프 곡선: 1→2→3→4→1 -->
  <g fill="none" stroke="#f59e0b" stroke-width="2.5">
    <path d="M320 212 C320 160 380 135 448 128" marker-end="url(#ao)"/>
    <path d="M512 128 C580 135 640 160 640 212" marker-end="url(#ao)"/>
    <path d="M640 248 C640 300 580 330 512 337" marker-end="url(#ao)"/>
    <path d="M448 337 C380 330 320 300 320 248" marker-end="url(#ao)"/>
  </g>

  <!-- 1 세션 시작 -->
  <circle cx="290" cy="230" r="26" fill="#f59e0b"/>
  <text class="num" x="290" y="237" text-anchor="middle">1</text>
  <text class="ink card" x="290" y="278" text-anchor="middle">세션 시작</text>
  <text class="sub lbl"  x="290" y="296" text-anchor="middle">hot — 문맥 주입</text>

  <!-- 2 작업 -->
  <circle cx="480" cy="120" r="26" fill="#f59e0b"/>
  <text class="num" x="480" y="127" text-anchor="middle">2</text>
  <text class="ink card" x="480" y="66" text-anchor="middle">작업</text>
  <text class="sub lbl"  x="480" y="48" text-anchor="middle">read — 회상하며 결정</text>

  <!-- 3 세션 종료 -->
  <circle cx="670" cy="230" r="26" fill="#f59e0b"/>
  <text class="num" x="670" y="237" text-anchor="middle">3</text>
  <text class="ink card" x="670" y="278" text-anchor="middle">세션 종료</text>
  <text class="sub lbl"  x="670" y="296" text-anchor="middle">write — 기록 (멱등)</text>

  <!-- 4 검증 · 복구 -->
  <circle cx="480" cy="345" r="26" fill="#10b981"/>
  <text class="num" x="480" y="352" text-anchor="middle">4</text>
  <text class="ink card" x="480" y="390" text-anchor="middle">검증 · 복구</text>
  <text class="sub lbl"  x="480" y="408" text-anchor="middle">audit · restore</text>

  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
