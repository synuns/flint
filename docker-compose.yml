services:
  doltgres:
    image: dolthub/doltgresql@sha256:74cedde648438b25818aa4bac23514ff346c9245e5ea583358ca6a9159a1e378
    ports:
      - "5434:5432"
    environment:
      DOLTGRES_USER: flint
      DOLTGRES_PASSWORD: flint-dev
      # ADR-0010 DSN(postgresql://flint:flint-dev@localhost:5434/flint)의 DB명
      DOLTGRES_DB: flint
    restart: unless-stopped
    volumes:
      - doltgres-data:/var/lib/doltgres

volumes:
  doltgres-data:
