# T43 GoReleaser — darwin arm64/amd64 교차 빌드, 버전 ldflags 주입.
# 실행(로컬): goreleaser release --snapshot --clean
# 실 릴리스는 사용자 확인 후 태그 push로 수행(워크플로는 안내만).
version: 2

builds:
  - id: flint
    main: ./cmd/flint
    binary: flint
    goos: [darwin]
    goarch: [arm64, amd64]
    ldflags:
      - -s -w -X flint/lib/cli.version={{.Version}} -X flint/lib/cli.commit={{.Commit}}

archives:
  - id: flint
    builds: [flint]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
