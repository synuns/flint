# T43 GoReleaser — darwin arm64/amd64 교차 빌드, 버전 ldflags 주입.
# 실행(로컬): goreleaser release --snapshot --clean
# 실 릴리스는 사용자 확인 후 태그 push로 수행(ci.yml release 잡이 자동 생성).
version: 2

builds:
  - id: flint
    main: ./cmd/flint
    binary: flint
    # v0.16.1: linux 추가(amd64/arm64 — 순수 Go, cgo 미사용이라 크로스 빌드 무구).
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    ldflags:
      - -s -w -X flint/lib/cli.version={{.Version}} -X flint/lib/cli.commit={{.Commit}}

archives:
  - id: flint
    ids: [flint]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # T1 플러그인 마켓플레이스 배포용 — flint-plugin/ 소스 일괄 zip(바이너리 미포함).
  # meta: true → 바이너리 0개 아카이브(name_template에 Os/Arch 금지).
  - id: flint-plugin
    name_template: "flint_plugin_{{ .Version }}"
    formats: ["zip"]
    meta: true
    # v0.16.1: 테스트 파일(*_test.go) 제외 — goreleaser files는 부정 glob("!...") 미지원
    # (무시됨, 실증)이라 include 나열로 대체. 루트에 비테스트 파일 추가 시 여기 반영 필요.
    files:
      - flint-plugin/.claude-plugin/**
      - flint-plugin/.mcp.json
      - flint-plugin/commands/**
      - flint-plugin/hooks/**
      - flint-plugin/skills/**

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
