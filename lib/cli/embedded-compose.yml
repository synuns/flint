name: flint

services:
  doltgres:
    image: dolthub/doltgresql@sha256:3a119bb6726a0be283cfda2a73fa9fbdff58df06c0b850f245cd1828f57281a6
    ports:
      - "127.0.0.1:${FLINT_PORT:-5434}:5432"
    environment:
      DOLTGRES_USER: flint
      DOLTGRES_PASSWORD: flint-dev
      DOLTGRES_DB: flint
    restart: unless-stopped
    volumes:
      - doltgres-data:/var/lib/doltgres

volumes:
  doltgres-data:
